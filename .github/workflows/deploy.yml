# Guiripisos Deployment Workflow!
#
# Branch convention:
#   - `production` branch → deploys to production environment (required)
#   - `staging` branch → deploys to staging environment (OPTIONAL)
#   - `main` branch → default development branch (no auto-deploy)
#
# If your project does NOT have a staging environment:
#   1. Remove `staging` from the push branches list
#   2. Remove `staging` from the workflow_dispatch options
#
# Frontend is deployed via SFTP, backend via SSH + Docker Compose.
#
# Required Variables (Environment level - per environment):
#   - SERVER_URL: Server IP address (e.g., 78.46.45.253)
#   - SERVER_REMOTE_PATH: Full path to the cloned repo on server
#   - NEXT_PUBLIC_GUIRI_API_BASE: API URL for frontend
#   - NEXT_PUBLIC_SITE_URL: Site URL for frontend
#
# Required Secrets (Environment level - per environment):
#   - SERVER_PORT: SSH port (usually 22)
#   - SERVER_USER: SSH user (deploy)
#   - SERVER_SSH_PRIVATE_KEY: SSH private key for deployment
#
# Note: Database credentials are stored in the .env file on the server.

name: Deploy

on:
  push:
    branches:
      - production
      - main # TEMP
      - staging  # Optional: remove if project has no staging environment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - main  # TEMP
          - staging  # Optional: remove if project has no staging environment

env:
  PROJECT_NAME: guiripisos
  FRONTEND_PATH: frontend/next-app

jobs:
  # ============================================================
  # Determine deployment environment based on branch
  # ============================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      branch: ${{ steps.set-env.outputs.branch }}
      domain: ${{ steps.set-env.outputs.domain }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/production" ]; then
            ENV="production"
          else
            ENV="production" # TEMP
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "branch=$ENV" >> $GITHUB_OUTPUT
          
          if [ "$ENV" == "production" ]; then
            echo "domain=apartamento.danielca.net" >> $GITHUB_OUTPUT
          else
            echo "domain=stg.apartamento.danielca.net" >> $GITHUB_OUTPUT
          fi


  # ============================================================
  # Build and deploy frontend via SFTP
  # ============================================================
  deploy-frontend:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
            lfs: true

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/next-app/**'
              - '.github/workflows/deploy.yml'
            workflow:
              - '.github/workflows/deploy.yml'

      - name: Setup Node.js
        if: steps.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version: '25.1.0'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_PATH }}

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm ci

      - name: Configure Application Environment Variables
        if: steps.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cp ${{ env.FRONTEND_PATH }}/.env.sample ${{ env.FRONTEND_PATH }}/.env
          sed -i "s#NEXT_PUBLIC_GUIRI_API_BASE=.*#NEXT_PUBLIC_GUIRI_API_BASE=${{ vars.NEXT_PUBLIC_GUIRI_API_BASE }}#" ${{ env.FRONTEND_PATH }}/.env
          sed -i "s#NEXT_PUBLIC_SITE_URL=.*#NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}#" ${{ env.FRONTEND_PATH }}/.env

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.FRONTEND_PATH }}
        run: npm run build
        env:
          CI: true

      - name: Deploy via SFTP
        if: steps.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ vars.SERVER_URL }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          ssh_private_key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          local_path: './${{ env.FRONTEND_PATH }}/out/*'
          remote_path: ${{ vars.SERVER_REMOTE_PATH }}/infra/frontend_build
          sftp_only: true
          delete_remote_files: false

      - name: Skip frontend deploy
        if: steps.changes.outputs.frontend != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No frontend changes detected, skipping deployment"

  # ============================================================
  # Deploy backend services via SSH + Docker Compose
  # ============================================================
  deploy-backend:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.SERVER_URL }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            echo "🚀 Deploying ${{ env.PROJECT_NAME }} to ${{ needs.setup.outputs.environment }}"
            
            # Navigate to project directory
            cd ${{ vars.SERVER_REMOTE_PATH }}
            
            # Pull latest changes
            echo "📥 Pulling latest changes from ${{ needs.setup.outputs.branch }}..."
            git fetch origin ${{ needs.setup.outputs.branch }}
            git reset --hard origin/${{ needs.setup.outputs.branch }}
            
            # Run deployment
            echo "🐳 Starting Docker deployment..."
            cd infra
            chmod +x deploy.sh
            ./deploy.sh
            
            echo "✅ Deployment complete!"

  # ============================================================
  # Health check after deployment
  # ============================================================
  health-check:
    needs: [setup, deploy-backend]
    runs-on: ubuntu-latest
    
    steps:
      - name: Wait for services
        run: sleep 30

      - name: Check API health
        continue-on-error: true
        run: |
          DOMAIN="${{ needs.setup.outputs.domain }}"
          
          echo "Checking https://api.${DOMAIN}/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.${DOMAIN}/health" --max-time 10 || echo "000")
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ API is healthy (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ API health check returned HTTP $HTTP_STATUS"
            echo "Note: This may be normal if /health endpoint doesn't exist"
          fi

      - name: Check frontend
        continue-on-error: true
        run: |
          DOMAIN="${{ needs.setup.outputs.domain }}"
          
          echo "Checking https://${DOMAIN}..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}" --max-time 10 || echo "000")
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Frontend is accessible (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ Frontend returned HTTP $HTTP_STATUS"
          fi

  # ============================================================
  # Summary
  # ============================================================
  summary:
    needs: [setup, deploy-frontend, deploy-backend, health-check]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Project | ${{ env.PROJECT_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ needs.setup.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Domain | ${{ needs.setup.outputs.domain }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ needs.setup.outputs.branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ needs.health-check.result }} |" >> $GITHUB_STEP_SUMMARY
