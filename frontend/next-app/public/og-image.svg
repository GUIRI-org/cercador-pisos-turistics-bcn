<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent top bar -->
  <rect width="1200" height="8" fill="url(#accent)"/>

  <!-- Decorative building silhouettes (right side) -->
  <g opacity="0.07" fill="#1e293b">
    <!-- Building 1 -->
    <rect x="820" y="180" width="60" height="380"/>
    <rect x="832" y="150" width="36" height="30"/>
    <!-- Windows -->
    <rect x="830" y="200" width="12" height="16" fill="white" opacity="0.6"/>
    <rect x="850" y="200" width="12" height="16" fill="white" opacity="0.6"/>
    <rect x="830" y="230" width="12" height="16" fill="white" opacity="0.6"/>
    <rect x="850" y="230" width="12" height="16" fill="white" opacity="0.6"/>
    <rect x="830" y="260" width="12" height="16" fill="white" opacity="0.6"/>
    <rect x="850" y="260" width="12" height="16" fill="white" opacity="0.6"/>
    <rect x="830" y="290" width="12" height="16" fill="white" opacity="0.6"/>
    <rect x="850" y="290" width="12" height="16" fill="white" opacity="0.6"/>
    <!-- Building 2 -->
    <rect x="900" y="240" width="80" height="320"/>
    <rect x="916" y="210" width="48" height="30"/>
    <!-- Building 3 -->
    <rect x="1000" y="160" width="50" height="400"/>
    <rect x="1010" y="130" width="30" height="30"/>
    <!-- Building 4 -->
    <rect x="1070" y="200" width="70" height="360"/>
    <!-- Building 5 -->
    <rect x="1155" y="270" width="50" height="290"/>
  </g>

  <!-- Left accent strip -->
  <rect x="80" y="120" width="6" height="390" rx="3" fill="url(#accent)" opacity="0.5"/>

  <!-- Main title -->
  <text x="120" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="700" fill="#0f172a" letter-spacing="-1">Barcelona</text>
  <text x="120" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="700" fill="#0f172a" letter-spacing="-1">Tourist Apartments</text>

  <!-- Subtitle -->
  <text x="120" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#475569">Identificar habitatges amb llicència turística</text>
  <text x="120" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#475569">a Barcelona</text>

  <!-- Divider -->
  <rect x="120" y="450" width="480" height="2" rx="1" fill="#cbd5e1"/>

  <!-- Data source badge -->
  <rect x="120" y="474" width="220" height="36" rx="6" fill="#dbeafe"/>
  <text x="140" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1d4ed8">Open Data BCN</text>

  <rect x="356" y="474" width="200" height="36" rx="6" fill="#ede9fe"/>
  <text x="376" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#5b21b6">GeoBCN API</text>

  <!-- Bottom brand -->
  <text x="120" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#94a3b8">El Guiri · elguiri.cat</text>
</svg>
