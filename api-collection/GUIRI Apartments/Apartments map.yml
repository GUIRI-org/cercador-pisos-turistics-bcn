info:
  name: Apartments map
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/api/v1/apartments/map"
  auth: inherit

docs: |-
  # Get All Apartments (Map View)
  
  Returns all tourist apartments in Barcelona without pagination.
  Ideal for displaying all apartments on a map visualization.
  
  ## Response Structure
  ```json
  {
    "data": [
      {
        "n_expedient": "...",
        "nom_districte": "...",
        "nom_barri": "...",
        "carrer": "...",
        "num1": 123,
        "longitud_x": 2.17,
        "latitud_y": 41.38,
        ...
      }
    ],
    "meta": {
      "total": 12345
    }
  }
  ```
  
  ## Cache
  This endpoint is cached for 7 days (604800 seconds) as the data changes only 1-2 times per year.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
