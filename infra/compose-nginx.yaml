x-common-env: &common-env
  - path: .env # default
    required: true
  - path: .env-local # optional override
    required: false

name: ${GLOBAL_INSTALLATION_APP}

networks:
  guiripisos-network:
    name: ${DOCKER_BASE_NAME}-network

services:
  nginx:
    env_file: *common-env
    networks:
      - guiripisos-network
    image: nginx:1.27
    container_name: ${DOCKER_BASE_NAME}-nginx
    restart: always
    environment:
      - ENABLE_FRONTEND=${ENABLE_FRONTEND:-false}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./nginx/docker:/etc/nginx/templates:ro
      - ./frontend_build/:/frontend/:ro
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"
    entrypoint: ["/etc/nginx/templates/docker-entrypoint.sh"]
