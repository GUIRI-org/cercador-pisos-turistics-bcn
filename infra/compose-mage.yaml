x-common-env: &common-env
  - path: .env # default
    required: true
  - path: .env-local # optional override
    required: false

name: ${GLOBAL_INSTALLATION_APP}

networks:
  guiripisos-network:
    name: ${DOCKER_BASE_NAME}-network

services:
  magic:
    env_file: *common-env
    networks:
      - guiripisos-network
    command: mage start ${MAGE_PROJECT_NAME}
    container_name: ${DOCKER_BASE_NAME}-mage
    build:
      context: .
      dockerfile: Dockerfile.mage
      args:
        - USER_CODE_PATH=/home/src/${MAGE_PROJECT_NAME}
        - USER_UID=${MAGE_UID:-1000}
        - USER_GID=${MAGE_GID:-1000}
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      ENV: ${GLOBAL_ENV}
      USER_CODE_PATH: /home/src/${MAGE_PROJECT_NAME}
      POSTGRES_DB: ${GLOBAL_DB_NAME}
      POSTGRES_USER: ${GLOBAL_DB_USER}
      POSTGRES_PASSWORD: ${GLOBAL_DB_PASSWORD}
      POSTGRES_HOST: ${DOCKER_BASE_NAME}-pgsql
      PG_HOST_PORT: 5432
    ports:
      - 127.0.0.1:${MAGE_PORT}:6789
    # We want the mage service to be started every time the server starts running, regardles of its state when the server shutted off.
    restart: always
    # Mage's scheduler relies on Python multiprocessing (semaphores/pipes via /dev/shm).
    # Docker's default 64MB /dev/shm is too small and causes BrokenPipeError crash loops.
    shm_size: '1gb'
    volumes:
      - ../magic/:/home/src/
      - ../data:/home/src/data
    depends_on:
      - db

volumes:
  magic-vol:
    name: ${DOCKER_BASE_NAME}-magic-vol
